server:
  port: 8080

spring:
  application:
    name: knowledgelink-gateway
  cloud:
    gateway:
      routes:
        - id: user_route
          uri: http://127.0.0.1:8086
          predicates:
            - Path=/user/**
        - id: trade_route
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/trade/**
        - id: forum_route
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/forum/**
        - id: chat_route
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/chat/**
    nacos:
      server-addr: 175.27.129.187:8848
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      host: 101.42.227.93
      port: 6379
      password: 133017
      database: 1
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          min-idle: 8
          max-idle: 8
          max-active: 20
          max-wait: 2000ms
          time-between-eviction-runs: 30s

gateway:
  auth:
    enabled: true
    header-name: Authorization
    token-prefix: Bearer
    whitelist:
      - /user/login
      - /user/register
      - /forum/getNewsList
      - /forum/getNewsDetail
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**

jwt:
  secret: knowledge-link-local-jwt-secret-2026-very-long-key

# 日志配置
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.github.gateway: debug
  file:
    name: logs/KnowledgeLink-gateway.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 360
      total-size-cap: 1GB
      clean-history-on-start: false

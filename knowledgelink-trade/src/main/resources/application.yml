server:
  port: 8081
  servlet:
    context-path: /trade

# 应用名称
spring:
  application:
    name: book
  servlet:
    # 文件上传配置信息
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB  #整体文件最大请求限制

# 日志配置
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.github.trade: debug
  file:
    name: logs/KnowledgeLink-trade.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 360
      total-size-cap: 1GB
      clean-history-on-start: false







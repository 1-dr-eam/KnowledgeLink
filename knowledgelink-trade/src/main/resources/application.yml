# 日志配置
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.github.trade: debug
  file:
    name: logs/KnowledgeLink-trade.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 360
      total-size-cap: 1GB
      clean-history-on-start: false






